name: Daily BTC Pipeline

on:
  schedule:
    - cron: '0 14 * * *'  # 매일 한국 시간 오후 11시 (UTC 14:00) 실행 -> 12시 전에 완료 목표
  workflow_dispatch:      # 수동 실행 버튼 활성화

permissions:
  contents: write         # 데이터 업데이트 후 GitHub에 다시 푸시하기 위한 권한

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 모델 학습이 오래 걸릴 수 있으므로 8시간으로 넉넉하게 설정
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Current Time (KST)
        run: |
          export TZ='Asia/Seoul'
          echo "Current time in KST: $(date)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p data/logs
          echo "============================================================" >> data/logs/cron_job.log
          echo "Starting Daily Run: $(date)" >> data/logs/cron_job.log
          echo "============================================================" >> data/logs/cron_job.log
          python src/run_pipeline.py 2>&1 | tee -a data/logs/cron_job.log
          echo "✅ Daily run finished at $(date)" >> data/logs/cron_job.log

      - name: Train Transformer Models
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "============================================================" >> data/logs/cron_job.log
          echo "Step TF: Transformer retrain sync" >> data/logs/cron_job.log
          python src/train_transformer.py 2>&1 | tee -a data/logs/cron_job.log
          TF_EXIT=${PIPESTATUS[0]}
          if [ $TF_EXIT -eq 0 ]; then
            echo "✅ Transformer retrain completed at $(date)" >> data/logs/cron_job.log
          else
            echo "⚠️ Transformer retrain failed (exit $TF_EXIT) at $(date)" >> data/logs/cron_job.log
          fi

      - name: Reality Check Sync
        run: |
          echo "Step RC: Reality Check sync" >> data/logs/cron_job.log
          python src/verify_reliability.py 2>&1 | tee -a data/logs/cron_job.log
          echo "✅ Scheduled run completed successfully at $(date)" >> data/logs/cron_job.log

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # data/·models/는 .gitignore에 등재돼 있으나 배포에 필요한 추적 자산이므로 -f로 강제 스테이징.
          # (이 -f 누락이 v1.1.3까지 "git add" exit 1 → set -e로 단계 전체 실패의 근본 원인이었음)
          git add -f data/ models/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data, models, and logs: $(date +'%Y-%m-%d %H:%M KST')"
          fi
          # 원격이 앞서가도 안전하게 정합: 미스테이징 변경은 --autostash로 자동 보관 후 리베이스
          git pull --rebase --autostash origin main
          git push origin main
