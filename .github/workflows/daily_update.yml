name: Daily BTC Pipeline

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 한국 시간 오전 0시 (UTC 15:00) 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

permissions:
  contents: write         # 데이터 업데이트 후 GitHub에 다시 푸시하기 위한 권한

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/run_pipeline.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # 데이터와 모델 폴더의 변경사항을 추적
          git add data/ models/
          git commit -m "Auto-update data and models: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
